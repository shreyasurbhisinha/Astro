services:
  postgres:
    image: postgres:17
    container_name: astro-postgres
    environment:
      POSTGRES_DB: astro
      POSTGRES_USER: astro
      POSTGRES_PASSWORD: astro
    ports:
      - "5433:5432"
    volumes:
      - astro-pg:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astro -d astro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  astro-pg:
